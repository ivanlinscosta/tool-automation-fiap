components:
  schemas:
    AccessMatrixCreate:
      properties:
        sistema:
          type: string
          title: Sistema
          description: Sistema alvo.
          examples:
          - erp-financeiro
        perfil:
          type: string
          title: Perfil
          description: Perfil funcional.
          examples:
          - analista-rh
        nivel_acesso:
          type: string
          title: Nivel Acesso
          description: 'Um de: LEITURA, ESCRITA, ADMIN.'
          examples:
          - LEITURA
        aprovado:
          type: boolean
          title: Aprovado
          description: Define se o acesso foi aprovado no ato.
          default: true
          examples:
          - true
        aprovador:
          anyOf:
          - type: string
          - type: 'null'
          title: Aprovador
          description: Nome do aprovador.
          examples:
          - gestor.ti
      type: object
      required:
      - sistema
      - perfil
      - nivel_acesso
      title: AccessMatrixCreate
      examples:
      - aprovado: true
        aprovador: gestor.ti
        nivel_acesso: LEITURA
        perfil: analista-rh
        sistema: erp-financeiro
    AccessMatrixResponse:
      properties:
        id:
          type: string
          title: Id
        candidate_id:
          type: string
          title: Candidate Id
        sistema:
          type: string
          title: Sistema
        perfil:
          type: string
          title: Perfil
        nivel_acesso:
          type: string
          title: Nivel Acesso
        aprovado:
          type: boolean
          title: Aprovado
        aprovador:
          anyOf:
          - type: string
          - type: 'null'
          title: Aprovador
        data_aprovacao:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Data Aprovacao
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - candidate_id
      - sistema
      - perfil
      - nivel_acesso
      - aprovado
      - created_at
      - updated_at
      title: AccessMatrixResponse
    ActionPlanCompleteRequest:
