          type: string
          example: STU004
        request_type:
          type: string
          example: reissue_student_card
        justification:
          type: string
          example: O cartão foi perdido no deslocamento para o campus.
        risk:
          type: string
          enum: [low, medium, high]
          example: high
      required: [student_id, request_type, justification, risk]
    ApprovalDecision:
      type: object
      properties:
        decision:
          type: string
          enum: [approved, rejected]
          example: approved
        approved_by:
          type: string
          example: tutor.lab@fiap.fake
        comment:
          type: string
          example: Aprovado na simulação para continuidade do atendimento.
      required: [decision, approved_by, comment]
    AuditEvent:
      type: object
      properties:
        event_id:
          type: string
          example: EVT-9001
        event_type:
          type: string
          example: request_created
        student_id:
          type: string
          example: STU001
        timestamp:
          type: string
          format: date-time
          example: '2026-09-11T10:00:00Z'
        resource_type:
          type: string
          example: request
        resource_id:
          type: string
          example: REQ-1001
        metadata_json:
          type: string
          example: '{"category":"digital_learning","priority":"high"}'
      required: [event_id, event_type, student_id, timestamp, resource_type, resource_id, metadata_json]
    LabSlowResponse:
      type: object
      properties:
        message:
          type: string
          example: Response after 3 seconds
        seconds:
          type: integer
          example: 3
      required: [message, seconds]
    LabRateLimitSuccess:
      type: object
      properties:
        message:
          type: string
          example: Request accepted
        student_id:
          type: string
          example: grupo-01
        requests_in_window:
          type: integer
          example: 2
      required: [message, student_id, requests_in_window]
    LabValidationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: aluno@studentdesk.lab
        amount:
          type: number
          minimum: 0
          example: 15
      required: [email, amount]
    LabValidationResponse:
      type: object
      properties:
        message:
          type: string
          example: Validation passed
        email:
          type: string
          format: email
          example: aluno@studentdesk.lab
        amount:
          type: number
          example: 15
      required: [message, email, amount]
    ErrorMessage:
      type: object
      properties:
        detail:
          type: string
          example: Resource not found (simulated)
      required: [detail]
    RateLimitError:
      type: object
      properties:
        detail:
          type: string
          example: Too many requests
        retry_after_seconds:
          type: integer
          example: 10
      required: [detail, retry_after_seconds]
    ValidationErrorItem:
      type: object
      properties:
        loc:
          type: array
          items:
            oneOf:
              - type: string
              - type: integer
        msg:
          type: string
        type:
          type: string
      required: [loc, msg, type]
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
      required: [detail]
