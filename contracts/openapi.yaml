openapi: 3.1.0
info:
  title: FIAP Student Desk Lab API
  description: Central Inteligente de Solicitações Acadêmicas — pedagogical API for automation lab
  version: 1.0.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: http://localhost:8000
    description: Local development server
tags:
  - name: Health
    description: Service health and readiness checks
  - name: Root
    description: API entrypoint metadata
  - name: Students
    description: Student directory lookup endpoints
  - name: Departments
    description: Academic department routing and SLA reference
  - name: Knowledge
    description: Knowledge base browsing and search endpoints
  - name: Priority
    description: Deterministic priority evaluation for academic requests
  - name: Requests
    description: Student request creation, listing, and updates
  - name: Interactions
    description: Conversation and grounded-response logging
  - name: Approvals
    description: Human approval workflow endpoints for sensitive actions
  - name: Events
    description: Audit trail and event stream access
  - name: Lab - Failure Scenarios
    description: Deliberate timeout, 404, 422, 429 and 500 scenarios for workflow labs
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Get API health status
      description: Returns a simple health payload for local checks and workflow readiness probes.
      parameters:
        - $ref: '#/components/parameters/XStudentID'
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                service: fiap-student-desk-lab-api
                version: 1.0.0
  /:
    get:
      tags: [Root]
      operationId: getRoot
      summary: Get root API metadata
      description: Returns entrypoint links and service metadata for the lab API.
      parameters:
        - $ref: '#/components/parameters/XStudentID'
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: Root metadata returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootResponse'
              example:
                service: FIAP Student Desk Lab API
                docs: /docs
                openapi: /openapi.json
                health: /health
                description: Central Inteligente de Solicitações Acadêmicas
  /api/v1/students:
    get:
      tags: [Students]
      operationId: listStudents
      summary: List students
      description: Returns the fictional student directory used in classroom automation scenarios.
      parameters:
        - $ref: '#/components/parameters/XStudentID'
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: Students retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Student'
              example:
                - id: STU001
                  name: Ana Beatriz Souza
                  course: Engenharia de Software
                  semester: 4
                  shift: night
                  campus: Paulista
                  email: ana.beatriz@studentdesk.lab
                  status: active
                - id: STU002
                  name: Lucas Ferreira Lima
                  course: Data Science
                  semester: 2
                  shift: morning
                  campus: Vila Olímpia
                  email: lucas.ferreira@studentdesk.lab
                  status: active
  /api/v1/students/{student_id}:
    get:
      tags: [Students]
      operationId: getStudentById
      summary: Get student by ID
      description: Retrieves a fictional student profile for testing request routing and enrichment flows.
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/XStudentID'
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: Student found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
              example:
                id: STU001
                name: Ana Beatriz Souza
                course: Engenharia de Software
                semester: 4
                shift: night
                campus: Paulista
                email: ana.beatriz@studentdesk.lab
                status: active
        '404':
          $ref: '#/components/responses/NotFoundStudent'
  /api/v1/departments:
    get:
      tags: [Departments]
      operationId: listDepartments
      summary: List departments
      description: Returns all academic service departments available for request assignment.
      parameters:
        - $ref: '#/components/parameters/XStudentID'
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: Departments retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
              example:
                - category: digital_learning
                  department: Digital Learning Hub
                  email: digital.learning@studentdesk.lab
                  queue: digital-learning
                  sla_default_hours: 4
                  requires_human_for_sensitive_actions: false
                - category: academic_records
                  department: Academic Records Office
                  email: academic.records@studentdesk.lab
                  queue: academic-records
                  sla_default_hours: 24
                  requires_human_for_sensitive_actions: true
                - category: finance
                  department: Student Finance Desk
                  email: finance@studentdesk.lab
                  queue: finance
                  sla_default_hours: 48
                  requires_human_for_sensitive_actions: true
                - category: career
                  department: Career Services Center
                  email: career@studentdesk.lab
                  queue: career-services
                  sla_default_hours: 24
                  requires_human_for_sensitive_actions: false
                - category: library
                  department: Library Support
                  email: library@studentdesk.lab
                  queue: library-support
                  sla_default_hours: 8
                  requires_human_for_sensitive_actions: false
                - category: campus_access
                  department: Campus Access Control
                  email: campus.access@studentdesk.lab
                  queue: campus-access
                  sla_default_hours: 2
                  requires_human_for_sensitive_actions: true
                - category: student_wellbeing
                  department: Student Wellbeing Office
                  email: wellbeing@studentdesk.lab
                  queue: student-wellbeing
                  sla_default_hours: 12
                  requires_human_for_sensitive_actions: true
                - category: accessibility
                  department: Accessibility and Inclusion Center
                  email: accessibility@studentdesk.lab
                  queue: accessibility
                  sla_default_hours: 24
                  requires_human_for_sensitive_actions: true
                - category: international_office
                  department: International Office
                  email: international@studentdesk.lab
                  queue: international-office
                  sla_default_hours: 48
                  requires_human_for_sensitive_actions: true
  /api/v1/departments/{category}:
    get:
      tags: [Departments]
      operationId: getDepartmentByCategory
      summary: Get department by category
      description: Retrieves routing metadata for a single academic support category.
      parameters:
        - $ref: '#/components/parameters/DepartmentCategory'
        - $ref: '#/components/parameters/XStudentID'
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: Department found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
              example:
                category: library
                department: Library Support
                email: library@studentdesk.lab
                queue: library-support
                sla_default_hours: 8
                requires_human_for_sensitive_actions: false
        '404':
          $ref: '#/components/responses/NotFoundDepartment'
  /api/v1/knowledge:
    get:
      tags: [Knowledge]
      operationId: listKnowledgeArticles
      summary: List knowledge articles
      description: Returns all knowledge-base articles, with optional filtering by category.
      parameters:
        - $ref: '#/components/parameters/KnowledgeCategoryQuery'
        - $ref: '#/components/parameters/XStudentID'
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: Knowledge articles retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeArticle'
              example:
                - id: KB001
                  title: Como recuperar acesso ao ambiente virtual
                  category: digital_learning
                  keywords: [ambiente virtual, senha, acesso]
                  content: Acesse o portal, clique em Esqueci minha senha e valide seu e-mail acadêmico.
                  can_answer_automatically: true
                  requires_human: false
                  last_updated: '2026-08-10T09:00:00Z'
                  source_type: faq
                - id: KB010
                  title: Solicitação de declaração de matrícula
                  category: academic_records
                  keywords: [declaração, matrícula, documento]
                  content: Gere a declaração no portal do aluno em Serviços Acadêmicos > Documentos.
                  can_answer_automatically: true
                  requires_human: false
                  last_updated: '2026-08-21T14:30:00Z'
                  source_type: policy_summary
  /api/v1/knowledge/search:
    get:
      tags: [Knowledge]
      operationId: searchKnowledge
      summary: Search knowledge articles
      description: Performs a simple keyword-style search across the fictional student support knowledge base.
      parameters:
        - $ref: '#/components/parameters/KnowledgeSearchQuery'
        - $ref: '#/components/parameters/KnowledgeCategoryQuery'
        - $ref: '#/components/parameters/XStudentID'
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: Search results returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSearchResponse'
              example:
                query: acesso ambiente
                results:
                  - id: KB001
                    title: Como recuperar acesso ao ambiente virtual
                    category: digital_learning
                    score: 0.98
                    content: Acesse o portal, clique em Esqueci minha senha e valide seu e-mail acadêmico.
                  - id: KB002
                    title: Primeiro acesso ao laboratório virtual
                    category: digital_learning
                    score: 0.81
                    content: O primeiro login exige confirmação do e-mail institucional e redefinição de senha.
  /api/v1/knowledge/{article_id}:
    get:
      tags: [Knowledge]
      operationId: getKnowledgeArticleById
      summary: Get knowledge article by ID
      description: Retrieves a single knowledge article for grounded response generation.
      parameters:
        - $ref: '#/components/parameters/ArticleId'
        - $ref: '#/components/parameters/XStudentID'
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: Knowledge article found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeArticle'
              example:
                id: KB001
                title: Como recuperar acesso ao ambiente virtual
                category: digital_learning
                keywords: [ambiente virtual, senha, acesso]
                content: Acesse o portal, clique em Esqueci minha senha e valide seu e-mail acadêmico.
                can_answer_automatically: true
                requires_human: false
                last_updated: '2026-08-10T09:00:00Z'
                source_type: faq
        '404':
          $ref: '#/components/responses/NotFoundKnowledgeArticle'
  /api/v1/priority/check:
    post:
      tags: [Priority]
      operationId: checkPriority
      summary: Check request priority
      description: Calculates deterministic priority and SLA based on category, impact, and urgency.
      parameters:
        - $ref: '#/components/parameters/XStudentID'
        - $ref: '#/components/parameters/XRequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriorityRequest'
            example:
              student_id: STU001
              category: digital_learning
              impact: high
              urgency: high
      responses:
        '200':
          description: Priority evaluated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriorityResponse'
              example:
                priority: critical
                sla_hours: 2
                requires_escalation: true
                rule: high_impact_high_urgency
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/requests:
    post:
      tags: [Requests]
      operationId: createStudentRequest
      summary: Create student request
      description: Creates a new academic request and assigns the responsible department queue.
      parameters:
        - $ref: '#/components/parameters/XStudentID'
        - $ref: '#/components/parameters/XRequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentRequestCreate'
            example:
              student_id: STU001
              category: digital_learning
              priority: high
              summary: Não consigo acessar o ambiente virtual
              description: O portal informa senha inválida mesmo após redefinição.
              source: n8n
      responses:
        '201':
          description: Student request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentRequest'
              example:
                request_id: REQ-1001
                protocol: SD-2026-0001
                status: open
                student_id: STU001
                category: digital_learning
                priority: high
                assigned_department: Digital Learning Hub
                queue: digital-learning
                summary: Não consigo acessar o ambiente virtual
                description: O portal informa senha inválida mesmo após redefinição.
                source: n8n
                lab_student_id: grupo-01
                created_at: '2026-09-11T10:00:00Z'
                updated_at: '2026-09-11T10:00:00Z'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [Requests]
      operationId: listStudentRequests
      summary: List student requests
      description: Lists requests scoped by X-Student-ID, with optional category, status, and priority filters.
      parameters:
        - $ref: '#/components/parameters/RequestCategoryQuery'
        - $ref: '#/components/parameters/RequestStatusQuery'
        - $ref: '#/components/parameters/RequestPriorityQuery'
        - $ref: '#/components/parameters/XStudentID'
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: Requests retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentRequest'
              example:
                - request_id: REQ-1001
                  protocol: SD-2026-0001
                  status: open
                  student_id: STU001
                  category: digital_learning
                  priority: high
                  assigned_department: Digital Learning Hub
                  queue: digital-learning
                  summary: Não consigo acessar o ambiente virtual
                  description: O portal informa senha inválida mesmo após redefinição.
                  source: n8n
                  lab_student_id: grupo-01
                  created_at: '2026-09-11T10:00:00Z'
                  updated_at: '2026-09-11T10:00:00Z'
  /api/v1/requests/{request_id}:
    get:
      tags: [Requests]
      operationId: getStudentRequestById
      summary: Get student request by ID
      description: Retrieves a previously created academic request.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/XStudentID'
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: Request found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentRequest'
              example:
                request_id: REQ-1001
                protocol: SD-2026-0001
                status: open
                student_id: STU001
                category: digital_learning
                priority: high
                assigned_department: Digital Learning Hub
                queue: digital-learning
                summary: Não consigo acessar o ambiente virtual
                description: O portal informa senha inválida mesmo após redefinição.
                source: n8n
                lab_student_id: grupo-01
                created_at: '2026-09-11T10:00:00Z'
                updated_at: '2026-09-11T10:00:00Z'
        '404':
          $ref: '#/components/responses/NotFoundRequest'
    patch:
      tags: [Requests]
      operationId: updateStudentRequest
      summary: Update student request
      description: Updates request status, priority, or assigned department after triage or human review.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/XStudentID'
        - $ref: '#/components/parameters/XRequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentRequestUpdate'
            example:
              status: in_progress
              priority: critical
              assigned_department: Campus Access Control
      responses:
        '200':
          description: Request updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentRequest'
              example:
                request_id: REQ-1003
                protocol: SD-2026-0003
                status: in_progress
                student_id: STU003
                category: campus_access
                priority: critical
                assigned_department: Campus Access Control
                queue: campus-access
                summary: Meu crachá parou de abrir a entrada principal
                description: Estou bloqueado do lado de fora antes da prova prática.
                source: api
                lab_student_id: grupo-01
                created_at: '2026-09-11T10:20:00Z'
                updated_at: '2026-09-11T10:35:00Z'
        '404':
          $ref: '#/components/responses/NotFoundRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/interactions:
    post:
      tags: [Interactions]
      operationId: createInteraction
      summary: Create interaction log
      description: Stores a classified or grounded interaction generated during the lab flow.
      parameters:
        - $ref: '#/components/parameters/XStudentID'
        - $ref: '#/components/parameters/XRequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionCreate'
            example:
              student_id: STU001
              request_text: Preciso da declaração de matrícula para o estágio.
              category: academic_records
              response_type: grounded_answer
              response_text: Você pode emitir a declaração no portal do aluno em Serviços Acadêmicos > Documentos.
              knowledge_articles: [KB010]
              source: dify
      responses:
        '201':
          description: Interaction created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
              example:
                interaction_id: INT-3001
                student_id: STU001
                request_text: Preciso da declaração de matrícula para o estágio.
                category: academic_records
                response_type: grounded_answer
                response_text: Você pode emitir a declaração no portal do aluno em Serviços Acadêmicos > Documentos.
                knowledge_articles: [KB010]
                source: dify
                lab_student_id: grupo-01
                created_at: '2026-09-11T10:05:00Z'
    get:
      tags: [Interactions]
      operationId: listInteractions
      summary: List interactions
      description: Lists logged interactions for workflow debugging and audit review.
      parameters:
        - $ref: '#/components/parameters/XStudentID'
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: Interactions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Interaction'
              example:
                - interaction_id: INT-3001
                  student_id: STU001
                  request_text: Preciso da declaração de matrícula para o estágio.
                  category: academic_records
                  response_type: grounded_answer
                  response_text: Você pode emitir a declaração no portal do aluno em Serviços Acadêmicos > Documentos.
                  knowledge_articles: [KB010]
                  source: dify
                  lab_student_id: grupo-01
                  created_at: '2026-09-11T10:05:00Z'
  /api/v1/interactions/{interaction_id}:
    get:
      tags: [Interactions]
      operationId: getInteractionById
      summary: Get interaction by ID
      description: Retrieves a single logged interaction.
      parameters:
        - $ref: '#/components/parameters/InteractionId'
        - $ref: '#/components/parameters/XStudentID'
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: Interaction found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
              example:
                interaction_id: INT-3001
                student_id: STU001
                request_text: Preciso da declaração de matrícula para o estágio.
                category: academic_records
                response_type: grounded_answer
                response_text: Você pode emitir a declaração no portal do aluno em Serviços Acadêmicos > Documentos.
                knowledge_articles: [KB010]
                source: dify
                lab_student_id: grupo-01
                created_at: '2026-09-11T10:05:00Z'
        '404':
          $ref: '#/components/responses/NotFoundInteraction'
  /api/v1/approval-requests:
    post:
      tags: [Approvals]
      operationId: createApprovalRequest
      summary: Create approval request
      description: Creates a sensitive academic action that may require human approval.
      parameters:
        - $ref: '#/components/parameters/XStudentID'
        - $ref: '#/components/parameters/XRequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequestCreate'
            example:
              student_id: STU004
              request_type: reissue_student_card
              justification: O cartão foi perdido no deslocamento para o campus.
              risk: high
      responses:
        '201':
          description: Approval request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
              example:
                approval_id: APR-7001
                student_id: STU004
                request_type: reissue_student_card
                justification: O cartão foi perdido no deslocamento para o campus.
                risk: high
                status: pending_approval
                requires_human_approval: true
                approved_by: null
                decision: null
                decision_comment: null
                decision_at: null
                lab_student_id: grupo-01
                created_at: '2026-09-11T10:15:00Z'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/approval-requests/{approval_id}:
    get:
      tags: [Approvals]
      operationId: getApprovalRequestById
      summary: Get approval request by ID
      description: Retrieves the status of a human approval workflow item.
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
        - $ref: '#/components/parameters/XStudentID'
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: Approval request found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
              example:
                approval_id: APR-7001
                student_id: STU004
                request_type: reissue_student_card
                justification: O cartão foi perdido no deslocamento para o campus.
                risk: high
                status: pending_approval
                requires_human_approval: true
                approved_by: null
                decision: null
                decision_comment: null
                decision_at: null
                lab_student_id: grupo-01
                created_at: '2026-09-11T10:15:00Z'
        '404':
          $ref: '#/components/responses/NotFoundApprovalRequest'
  /api/v1/approval-requests/{approval_id}/decision:
    post:
      tags: [Approvals]
      operationId: decideApprovalRequest
      summary: Decide approval request
      description: Records an approval or rejection decision for a previously created approval request.
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
        - $ref: '#/components/parameters/XStudentID'
        - $ref: '#/components/parameters/XRequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecision'
            example:
              decision: approved
              approved_by: tutor.lab@fiap.fake
              comment: Aprovado na simulação para continuidade do atendimento.
      responses:
        '200':
          description: Approval decision recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
              example:
                approval_id: APR-7001
                student_id: STU004
                request_type: reissue_student_card
                justification: O cartão foi perdido no deslocamento para o campus.
                risk: high
                status: approved
                requires_human_approval: true
                approved_by: tutor.lab@fiap.fake
                decision: approved
                decision_comment: Aprovado na simulação para continuidade do atendimento.
                decision_at: '2026-09-11T10:25:00Z'
                lab_student_id: grupo-01
                created_at: '2026-09-11T10:15:00Z'
        '404':
          $ref: '#/components/responses/NotFoundApprovalRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/events:
    get:
      tags: [Events]
      operationId: listAuditEvents
      summary: List audit events
      description: Lists fictional audit events generated by request, interaction, and approval flows.
      parameters:
        - $ref: '#/components/parameters/EventTypeQuery'
        - $ref: '#/components/parameters/XStudentID'
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: Audit events retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
              example:
                - event_id: EVT-9001
                  event_type: request_created
                  student_id: STU001
                  timestamp: '2026-09-11T10:00:00Z'
                  resource_type: request
                  resource_id: REQ-1001
                  metadata_json: '{"category":"digital_learning","priority":"high"}'
  /api/v1/lab/slow:
    get:
      tags: ['Lab - Failure Scenarios']
      operationId: getLabSlowScenario
      summary: Simulate slow response
      description: Sleeps for the requested number of seconds before returning a success payload.
      parameters:
        - $ref: '#/components/parameters/LabSlowSeconds'
        - $ref: '#/components/parameters/XStudentID'
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: Delayed response returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabSlowResponse'
              example:
                message: Response after 3 seconds
                seconds: 3
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/lab/error:
    get:
      tags: ['Lab - Failure Scenarios']
      operationId: getLabErrorScenario
      summary: Simulate internal server error
      description: Always returns a 500 response for classroom error-handling exercises.
      parameters:
        - $ref: '#/components/parameters/XStudentID'
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '500':
          description: Simulated internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                detail: Simulated internal server error
  /api/v1/lab/rate-limit:
    get:
      tags: ['Lab - Failure Scenarios']
      operationId: getLabRateLimitScenario
      summary: Simulate rate limiting
      description: Returns 200 while under the threshold and 429 once the demo limit is exceeded.
      parameters:
        - $ref: '#/components/parameters/XStudentID'
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: Request accepted within the rate limit window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabRateLimitSuccess'
              example:
                message: Request accepted
                student_id: grupo-01
                requests_in_window: 2
        '429':
          description: Too many requests
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
              example:
                detail: Too many requests
                retry_after_seconds: 10
  /api/v1/lab/not-found:
    get:
      tags: ['Lab - Failure Scenarios']
      operationId: getLabNotFoundScenario
      summary: Simulate not found
      description: Always returns a 404 response for negative-path testing.
      parameters:
        - $ref: '#/components/parameters/XStudentID'
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '404':
          description: Resource not found in the simulated scenario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                detail: Resource not found (simulated)
  /api/v1/lab/validation:
    post:
      tags: ['Lab - Failure Scenarios']
      operationId: postLabValidationScenario
      summary: Simulate validation behaviour
      description: Validates a small payload so workflow tools can observe 200 and 422 responses.
      parameters:
        - $ref: '#/components/parameters/XStudentID'
        - $ref: '#/components/parameters/XRequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabValidationRequest'
            example:
              email: aluno@studentdesk.lab
              amount: 15
      responses:
        '200':
          description: Validation passed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabValidationResponse'
              example:
                message: Validation passed
                email: aluno@studentdesk.lab
                amount: 15
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  headers:
    RetryAfter:
      description: Number of seconds to wait before retrying.
      schema:
        type: integer
        example: 10
  parameters:
    XStudentID:
      name: X-Student-ID
      in: header
      required: false
      description: Lab group identifier used to isolate records across student groups.
      schema:
        type: string
        default: anonymous
        example: grupo-01
    XRequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Correlation ID for workflow tracing in lab exercises.
      schema:
        type: string
        example: req-student-desk-001
    StudentId:
      name: student_id
      in: path
      required: true
      description: Fictional student identifier.
      schema:
        type: string
        example: STU001
    DepartmentCategory:
      name: category
      in: path
      required: true
      description: Department category key.
      schema:
        type: string
        example: digital_learning
    ArticleId:
      name: article_id
      in: path
      required: true
      description: Knowledge article identifier.
      schema:
        type: string
        example: KB001
    RequestId:
      name: request_id
      in: path
      required: true
      description: Student request identifier.
      schema:
        type: string
        example: REQ-1001
    InteractionId:
      name: interaction_id
      in: path
      required: true
      description: Interaction identifier.
      schema:
        type: string
        example: INT-3001
    ApprovalId:
      name: approval_id
      in: path
      required: true
      description: Approval request identifier.
      schema:
        type: string
        example: APR-7001
    KnowledgeSearchQuery:
      name: q
      in: query
      required: true
      description: Search query text.
      schema:
        type: string
        example: acesso ambiente
    KnowledgeCategoryQuery:
      name: category
      in: query
      required: false
      description: Optional category filter for knowledge articles.
      schema:
        type: string
        example: digital_learning
    RequestCategoryQuery:
      name: category
      in: query
      required: false
      schema:
        type: string
        example: finance
    RequestStatusQuery:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [open, in_progress, waiting_human, resolved, closed]
        example: open
    RequestPriorityQuery:
      name: priority
      in: query
      required: false
      schema:
        type: string
        enum: [low, medium, high, critical]
        example: high
    EventTypeQuery:
      name: event_type
      in: query
      required: false
      schema:
        type: string
        example: request_created
    LabSlowSeconds:
      name: seconds
      in: query
      required: false
      description: Delay duration in seconds.
      schema:
        type: integer
        minimum: 1
        maximum: 15
        default: 5
        example: 3
  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPValidationError'
          example:
            detail:
              - loc: [body, amount]
                msg: Input should be greater than or equal to 0
                type: greater_than_equal
    NotFoundStudent:
      description: Student not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          example:
            detail: Student not found
    NotFoundDepartment:
      description: Department not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          example:
            detail: 'Department not found for category: invalid'
    NotFoundKnowledgeArticle:
      description: Knowledge article not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          example:
            detail: Knowledge article not found
    NotFoundRequest:
      description: Student request not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          example:
            detail: Student request not found
    NotFoundInteraction:
      description: Interaction not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          example:
            detail: Interaction not found
    NotFoundApprovalRequest:
      description: Approval request not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          example:
            detail: Approval request not found
  schemas:
    RootResponse:
      type: object
      properties:
        service:
          type: string
        docs:
          type: string
        openapi:
          type: string
        health:
          type: string
        description:
          type: string
      required: [service, docs, openapi, health, description]
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        version:
          type: string
      required: [status, service, version]
    Student:
      type: object
      properties:
        id:
          type: string
          example: STU001
        name:
          type: string
          example: Ana Beatriz Souza
        course:
          type: string
          example: Engenharia de Software
        semester:
          type: integer
          example: 4
        shift:
          type: string
          enum: [morning, afternoon, night]
          example: night
        campus:
          type: string
          example: Paulista
        email:
          type: string
          format: email
          example: ana.beatriz@studentdesk.lab
        status:
          type: string
          enum: [active, inactive, on_leave]
          example: active
      required: [id, name, course, semester, shift, campus, email, status]
    Department:
      type: object
      properties:
        category:
          type: string
          enum: [digital_learning, academic_records, finance, career, library, campus_access, student_wellbeing, accessibility, international_office]
          example: digital_learning
        department:
          type: string
          example: Digital Learning Hub
        email:
          type: string
          format: email
          example: digital.learning@studentdesk.lab
        queue:
          type: string
          example: digital-learning
        sla_default_hours:
          type: integer
          example: 4
        requires_human_for_sensitive_actions:
          type: boolean
          example: false
      required: [category, department, email, queue, sla_default_hours, requires_human_for_sensitive_actions]
    KnowledgeArticle:
      type: object
      properties:
        id:
          type: string
          example: KB001
        title:
          type: string
          example: Como recuperar acesso ao ambiente virtual
        category:
          type: string
          example: digital_learning
        keywords:
          type: array
          items:
            type: string
          example: [ambiente virtual, senha, acesso]
        content:
          type: string
          example: Acesse o portal, clique em Esqueci minha senha e valide seu e-mail acadêmico.
        can_answer_automatically:
          type: boolean
          example: true
        requires_human:
          type: boolean
          example: false
        last_updated:
          type: string
          format: date-time
          example: '2026-08-10T09:00:00Z'
        source_type:
          type: string
          enum: [faq, policy_summary, process_guide, campus_notice]
          example: faq
      required: [id, title, category, keywords, content, can_answer_automatically, requires_human, last_updated, source_type]
    KnowledgeSearchResult:
      type: object
      properties:
        id:
          type: string
          example: KB001
        title:
          type: string
          example: Como recuperar acesso ao ambiente virtual
        category:
          type: string
          example: digital_learning
        score:
          type: number
          format: float
          example: 0.98
        content:
          type: string
          example: Acesse o portal, clique em Esqueci minha senha e valide seu e-mail acadêmico.
      required: [id, title, category, score, content]
    KnowledgeSearchResponse:
      type: object
      properties:
        query:
          type: string
          example: acesso ambiente
        results:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeSearchResult'
      required: [query, results]
    PriorityRequest:
      type: object
      properties:
        student_id:
          type: string
          example: STU001
        category:
          type: string
          enum: [digital_learning, academic_records, finance, career, library, campus_access, student_wellbeing, accessibility, international_office]
          example: digital_learning
        impact:
          type: string
          enum: [low, medium, high]
          example: high
        urgency:
          type: string
          enum: [low, medium, high]
          example: high
      required: [student_id, category, impact, urgency]
    PriorityResponse:
      type: object
      properties:
        priority:
          type: string
          enum: [low, medium, high, critical]
          example: critical
        sla_hours:
          type: integer
          example: 2
        requires_escalation:
          type: boolean
          example: true
        rule:
          type: string
          example: high_impact_high_urgency
      required: [priority, sla_hours, requires_escalation, rule]
    StudentRequest:
      type: object
      properties:
        request_id:
          type: string
          example: REQ-1001
        protocol:
          type: string
          example: SD-2026-0001
        status:
          type: string
          enum: [open, in_progress, waiting_human, resolved, closed]
          example: open
        student_id:
          type: string
          example: STU001
        category:
          type: string
          example: digital_learning
        priority:
          type: string
          enum: [low, medium, high, critical]
          example: high
        assigned_department:
          type: string
          example: Digital Learning Hub
        queue:
          type: string
          example: digital-learning
        summary:
          type: string
          example: Não consigo acessar o ambiente virtual
        description:
          type: string
          example: O portal informa senha inválida mesmo após redefinição.
        source:
          type: string
          enum: [api, n8n, make, dify, postman]
          example: n8n
        lab_student_id:
          type: string
          example: grupo-01
        created_at:
          type: string
          format: date-time
          example: '2026-09-11T10:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-09-11T10:00:00Z'
      required: [request_id, protocol, status, student_id, category, priority, assigned_department, queue, summary, description, source, lab_student_id, created_at, updated_at]
    StudentRequestCreate:
      type: object
      properties:
        student_id:
          type: string
          example: STU001
        category:
          type: string
          enum: [digital_learning, academic_records, finance, career, library, campus_access, student_wellbeing, accessibility, international_office]
          example: digital_learning
        priority:
          type: string
          enum: [low, medium, high, critical]
          example: high
        summary:
          type: string
          example: Não consigo acessar o ambiente virtual
        description:
          type: string
          example: O portal informa senha inválida mesmo após redefinição.
        source:
          type: string
          enum: [api, n8n, make, dify, postman]
          default: api
          example: n8n
      required: [student_id, category, priority, summary, description, source]
    StudentRequestUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [open, in_progress, waiting_human, resolved, closed]
          example: in_progress
        priority:
          type: string
          enum: [low, medium, high, critical]
          example: critical
        assigned_department:
          type: string
          example: Campus Access Control
      minProperties: 1
    Interaction:
      type: object
      properties:
        interaction_id:
          type: string
          example: INT-3001
        student_id:
          type: string
          example: STU001
        request_text:
          type: string
          example: Preciso da declaração de matrícula para o estágio.
        category:
          type: string
          example: academic_records
        response_type:
          type: string
          enum: [grounded_answer, request_created, escalation, clarification]
          example: grounded_answer
        response_text:
          type: string
          example: Você pode emitir a declaração no portal do aluno em Serviços Acadêmicos > Documentos.
        knowledge_articles:
          type: array
          items:
            type: string
          example: [KB010]
        source:
          type: string
          enum: [api, n8n, make, dify, postman]
          example: dify
        lab_student_id:
          type: string
          example: grupo-01
        created_at:
          type: string
          format: date-time
          example: '2026-09-11T10:05:00Z'
      required: [interaction_id, student_id, request_text, category, response_type, response_text, knowledge_articles, source, lab_student_id, created_at]
    InteractionCreate:
      type: object
      properties:
        student_id:
          type: string
          example: STU001
        request_text:
          type: string
          example: Preciso da declaração de matrícula para o estágio.
        category:
          type: string
          example: academic_records
        response_type:
          type: string
          enum: [grounded_answer, request_created, escalation, clarification]
          example: grounded_answer
        response_text:
          type: string
          example: Você pode emitir a declaração no portal do aluno em Serviços Acadêmicos > Documentos.
        knowledge_articles:
          type: array
          items:
            type: string
          example: [KB010]
        source:
          type: string
          enum: [api, n8n, make, dify, postman]
          default: api
          example: dify
      required: [student_id, request_text, category, response_type, response_text, knowledge_articles, source]
    ApprovalRequest:
      type: object
      properties:
        approval_id:
          type: string
          example: APR-7001
        student_id:
          type: string
          example: STU004
        request_type:
          type: string
          example: reissue_student_card
        justification:
          type: string
          example: O cartão foi perdido no deslocamento para o campus.
        risk:
          type: string
          enum: [low, medium, high]
          example: high
        status:
          type: string
          enum: [auto_approved, pending_approval, approved, rejected]
          example: pending_approval
        requires_human_approval:
          type: boolean
          example: true
        approved_by:
          type: [string, 'null']
          example: null
        decision:
          type: [string, 'null']
          example: null
        decision_comment:
          type: [string, 'null']
          example: null
        decision_at:
          type: [string, 'null']
          format: date-time
          example: null
        lab_student_id:
          type: string
          example: grupo-01
        created_at:
          type: string
          format: date-time
          example: '2026-09-11T10:15:00Z'
      required: [approval_id, student_id, request_type, justification, risk, status, requires_human_approval, approved_by, decision, decision_comment, decision_at, lab_student_id, created_at]
